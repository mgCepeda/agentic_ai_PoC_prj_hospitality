
services:

  # ChromaDB Vector Store
  vectorstore-db:
    image: chromadb/chroma:latest
    container_name: vectorstore-db
    ports:
      - "${CHROMA_PORT:-8000}:8000"
    volumes:
      - vectorstore_chroma-db:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - prj_hospitality-network

  bookings-db:
    image: postgres:15.3
    container_name: bookings-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - bookings_postgresql-db:/var/lib/postgresql/data
    env_file:
      - .env
    networks:
      - prj_hospitality-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  bookings-db-data-loader:
    image: bookings-db-data-loader
    container_name: bookings-db-data-loader
    build:
      context: ../bookings-db
      dockerfile: Dockerfile
    pull_policy: never
    depends_on:
      bookings-db:
        condition: service_healthy
    networks:
      - prj_hospitality-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DATABASE_CONFIG_LOGGING: "YES"
    command: ["/app/db/init-db.sh"]
    env_file:
      - .env

volumes:
  bookings_postgresql-db:
  vectorstore_chroma-db:

networks:
  prj_hospitality-network:
    driver: bridge