# Solace Agent Mesh Orchestrator Agent Configurations

log:
  stdout_log_level: INFO
  log_file_level: INFO
  log_file: hospitality-orchestrator.log

# Shared SAM config
!include ../shared_config.yaml

apps:
  - name: hospitality-orchestrator_app
    app_base_path: .
    app_module: solace_agent_mesh.agent.sac.app
    broker:
      <<: *broker_connection

    app_config:
      namespace: ${NAMESPACE} 
      supports_streaming: true
      agent_name: "HospitalityOrchestrator"
      display_name: "HospitalityOrchestrator"
      model: *planning_model 

      instruction: |
        You are the HospitalityOrchestrator. You coordinate two specialist agents:
        - HospitalityRag: answers questions about hotel details, room types, prices, addresses, and meal plans (uses a document knowledge base).
        - HospitalityBookings: answers questions about bookings, occupancy, revenues, RevPAR, and booking analytics (queries a PostgreSQL database).

        Routing rules — delegate to EXACTLY ONE agent per user query:
        - Questions about bookings, occupancy, revenues, RevPAR, number of bookings → delegate to `HospitalityBookings`
        - Questions about hotel info, room types, room prices, addresses, meal plans, hotel lists → delegate to `HospitalityRag`

        General rules:
        - Delegate EXACTLY ONCE. After receiving the response, immediately return it as your final answer. Do NOT call any agent again.
        - Pass the user's question text as-is when delegating (do not paraphrase it).
        - Do NOT answer from your own knowledge.
        - Do NOT claim data is missing unless the delegated agent explicitly says it is missing.
        - Keep answers short and actionable, in markdown format.
        - NEVER create files or artifacts unless the user explicitly asks for it.
        - STOP immediately after receiving the first response from the delegated agent.
      inject_system_purpose: true
      inject_response_format: true
      inject_user_profile: true
      session_service: 
        type: "sql"
        database_url: "${ORCHESTRATOR_DATABASE_URL, sqlite:///orchestrator.db}"
        default_behavior: "PERSISTENT"
      artifact_service: *default_artifact_service
      artifact_handling_mode: "reference" 
      enable_embed_resolution: true 
      enable_artifact_content_instruction: true 
      data_tools_config: *default_data_tools_config
      tools: []

      agent_card:
        description: "The Orchestrator component. It manages tasks and coordinates multi-agent workflows."
        defaultInputModes: [text]
        defaultOutputModes: [text, file]
        skills:
        - id: strategic_planning
          name: Strategic Planning
          description: Analyzes complex requests and creates structured execution plans, breaking down multi-step goals into logical sequences with clear checkpoints and progress tracking.

        - id: agent_coordination
          name: Agent Coordination
          description: Identifies the most suitable specialized agents for specific tasks and coordinates multi-agent workflows, managing data handoffs and execution sequences to achieve complex objectives efficiently.

        - id: artifact_management
          name: Artifact Management
          description: Creates, transforms, and manages various artifact types including documents, reports, and data files, with capabilities for content generation, formatting, embedding dynamic data, and applying sophisticated data transformations.

      agent_card_publishing: 
        interval_seconds: 10
      agent_discovery: 
        enabled: true
      inter_agent_communication:
        allow_list: ["*"]

        request_timeout_seconds: 600
